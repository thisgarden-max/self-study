  --paper-0:#FBFAF7; --paper-1:#FFFFFF; --paper-2:#F3F2ED; --paper-3:#E9E7DF;
  --ink-900:#161A28; --ink-700:#333A52; --ink-500:#5C6480; --ink-400:#8A90A5; --ink-300:#AFB4C4;
  --lamp:#F0A32E; --lamp-deep:#B9740C; --lamp-ink:#8A5406; --lamp-tint:#FDF1DC; --lamp-tint-2:#FBE4BE;
  --alert:#C4462A; --alert-tint:#FBEAE5;
  --info:#3E6B8C; --info-tint:#E8F0F5;
  --line:#E4E2DA; --line-strong:#CFCCC2;
  --shadow-sm:0 1px 2px rgba(22,26,40,.05); --shadow-md:0 4px 14px rgba(22,26,40,.07); --shadow-lg:0 14px 44px rgba(22,26,40,.12);
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px; --s8:64px;
  --r-sm:6px; --r-md:12px; --r-lg:20px;
  --ease:cubic-bezier(.22,.61,.36,1);
  --f-display:'Bricolage Grotesque','Pretendard Variable',sans-serif;
  --f-body:'Pretendard Variable','Bricolage Grotesque',sans-serif;
  --f-data:'DM Mono','Pretendard Variable',monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:radial-gradient(1000px 560px at 82% -14%, rgba(240,163,46,.13), transparent 62%),radial-gradient(720px 480px at 2% 104%, rgba(51,58,82,.06), transparent 66%),var(--paper-0);background-attachment:fixed;color:var(--ink-900);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--lamp-deep);outline-offset:3px;border-radius:var(--r-sm)}
.hidden{display:none !important}
.wrap{max-width:1180px;margin:0 auto;padding:0 var(--s5)}
.eyebrow{font-family:var(--f-data);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-400)}
.brandline{font-family:var(--f-data);font-size:11px;letter-spacing:.2em;color:var(--lamp-deep);font-weight:500}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);padding:11px var(--s4);border-radius:var(--r-sm);border:1px solid var(--line-strong);background:var(--paper-1);font-size:14px;font-weight:600;color:var(--ink-900);box-shadow:var(--shadow-sm);transition:transform .16s var(--ease),background .16s var(--ease),border-color .16s var(--ease),box-shadow .16s var(--ease)}
.btn:hover{background:var(--paper-2);border-color:var(--ink-300);box-shadow:var(--shadow-md)}
.btn:active{transform:scale(.975)}
.btn-primary{background:var(--lamp);color:#2A1A02;border-color:var(--lamp-deep)}
.btn-primary:hover{background:#FFB44A;border-color:var(--lamp-deep)}
.btn-ghost{background:transparent;border-color:var(--line);box-shadow:none}
.btn-ghost:hover{background:var(--paper-2)}
.btn-sm{padding:6px 10px;font-size:12.5px}
.btn-danger{border-color:rgba(196,70,42,.35);color:var(--alert);background:var(--paper-1)}
.btn-danger:hover{background:var(--alert-tint);border-color:var(--alert)}
.btn[disabled]{opacity:.42;pointer-events:none;box-shadow:none}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12.5px;color:var(--ink-500);font-weight:600}
.input{width:100%;padding:10px var(--s3);border-radius:var(--r-sm);background:var(--paper-1);border:1px solid var(--line-strong);font-size:14.5px;transition:border-color .16s var(--ease),box-shadow .16s var(--ease)}
.input:focus{border-color:var(--lamp-deep);outline:none;box-shadow:0 0 0 3px var(--lamp-tint)}
select.input{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-400) 50%),linear-gradient(135deg,var(--ink-400) 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
textarea.input{resize:vertical;font-family:var(--f-data);font-size:13px;line-height:1.7}
.card{background:var(--paper-1);border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--s5);box-shadow:var(--shadow-sm)}
#v-student{min-height:100dvh;display:flex;flex-direction:column;padding:var(--s5) var(--s4) var(--s6)}
.s-shell{width:100%;max-width:440px;margin:0 auto;flex:1;display:flex;flex-direction:column}
.s-head{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--s4);margin-bottom:var(--s6)}
.s-head h1{font-family:var(--f-display);font-weight:800;font-size:19px;letter-spacing:-.02em;line-height:1.2}
.s-head h1 .brandline{display:block;margin-bottom:4px}
.s-head h1 .place{display:block;font-family:var(--f-body);font-size:11px;font-weight:600;color:var(--ink-400);letter-spacing:0;margin-top:3px}
.s-date{font-family:var(--f-data);font-size:12px;color:var(--ink-400);text-align:right;line-height:1.5;white-space:nowrap}
.s-date b{display:block;color:var(--ink-900);font-size:15px;font-weight:500}
.s-stage{flex:1;display:flex;flex-direction:column;justify-content:center;gap:var(--s5)}
.period-banner{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) var(--s4);border-radius:var(--r-md);background:var(--paper-1);border:1px solid var(--line);box-shadow:var(--shadow-sm)}
.period-banner.live{border-color:var(--lamp);background:var(--lamp-tint)}
.period-banner.off{border-color:var(--line-strong);background:var(--paper-2)}
.period-banner.excused{border-color:var(--info);background:var(--info-tint)}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--ink-300);flex:none}
.period-banner.live .pulse{background:var(--lamp-deep);animation:pulse 2s var(--ease) infinite}
.period-banner.excused .pulse{background:var(--info)}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.8)}}

const DB=(()=>{
  const LP='sdl::';
  const lsOK=(()=>{try{localStorage.setItem('__t','1');localStorage.removeItem('__t');return true}catch(e){return false}})();
  const mem={};
  const enc=v=>JSON.stringify(v),dec=v=>{try{return JSON.parse(v)}catch(e){return v}};
  // 키를 Firestore 문서 ID로 안전 변환 (슬래시 등 금지문자 회피)
  const encId=k=>encodeURIComponent(k).replace(/\./g,'%2E').replace(/%/g,'_');
  let fs=null, ready=false;
  function initFirebase(){
    try{
      if(typeof firebase==='undefined'||!firebase.initializeApp) return false;
      if(!firebase.apps||!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
      fs=firebase.firestore();
      ready=true;
      return true;
    }catch(e){console.warn('Firebase init 실패, 로컬 저장으로 동작:',e);fs=null;ready=false;return false}
  }
  const col=()=>fs.collection('shared');
  // 로컬 폴백 (shared=false 인 me, 또는 Firebase 미연결 시)
  function lget(k,shared){const key=LP+(shared?'s:':'p:')+k;if(lsOK){const v=localStorage.getItem(key);return v===null?null:dec(v)}return mem[key]??null}
  function lset(k,v,shared){const key=LP+(shared?'s:':'p:')+k;if(lsOK){try{localStorage.setItem(key,enc(v));return true}catch(e){return false}}mem[key]=v;return true}
  function ldel(k,shared){const key=LP+(shared?'s:':'p:')+k;if(lsOK)localStorage.removeItem(key);else delete mem[key];return true}
  function llist(prefix,shared){const head=LP+(shared?'s:':'p:');const src=lsOK?Object.keys(localStorage):Object.keys(mem);return src.filter(k=>k.startsWith(head+prefix)).map(k=>k.slice(head.length))}

  async function get(k,shared=true){
    if(shared&&ready){try{const d=await col().doc(encId(k)).get();return d.exists?d.data().v:null}catch(e){return lget(k,shared)}}
    return lget(k,shared);
  }
  async function set(k,v,shared=true){
    if(shared&&ready){try{await col().doc(encId(k)).set({k,v});lset(k,v,shared);return true}catch(e){return lset(k,v,shared)}}
    return lset(k,v,shared);
  }
  async function del(k,shared=true){
    if(shared&&ready){try{await col().doc(encId(k)).delete();ldel(k,shared);return true}catch(e){return ldel(k,shared)}}
    return ldel(k,shared);
  }
  async function list(prefix='',shared=true){
    if(shared&&ready){
      try{
        // prefix 범위 쿼리: k >= prefix AND k < prefix+\uf8ff
        const snap=await col().orderBy('k').startAt(prefix).endAt(prefix+'\uf8ff').get();
        return snap.docs.map(d=>d.data().k).filter(k=>typeof k==='string'&&k.startsWith(prefix));
      }catch(e){return llist(prefix,shared)}
    }
    return llist(prefix,shared);
  }
  return {get,set,del,list,initFirebase,get isRemote(){return ready}};
})();

function dayStatus(d=new Date()){const dk=dateKey(d),dow=d.getDay(),days=CFG.opDays||[1,2,3,4];if(CFG.startDate&&dk<CFG.startDate)return{open:false,reason:'운영 시작 전'};if(CFG.endDate&&dk>CFG.endDate)return{open:false,reason:'운영 종료'};if(!days.includes(dow))return{open:false,reason:`${DOW[dow]}요일은 미운영`};if(EXCL[dk])return{open:false,reason:EXCL[dk]};return{open:true,reason:''}}

async function toggleSeatOn(id){

    const s=findStudent(id);if(!s)return;const r=TODAY[id];

      if(!confirm(`${s.name} 학생의 출석을 지울까요?`))return;

async function addWalkin(alsoCheck){
  const g=parseInt($('#wi-g').value,10),c=parseInt($('#wi-c').value,10),n=parseInt($('#wi-n').value,10),name=$('#wi-name').value.trim();
  if(!g||!c||!n||!name)return toast('학년·반·번호·이름을 모두 입력해 주세요.',true);
  const id=`${g}-${c}-${n}`;
  const exists=findStudent(id);
  if(exists){
    if(exists.name!==name && !confirm(`${g}학년 ${c}반 ${n}번은 이미 '${exists.name}'(으)로 등록되어 있습니다. 그대로 출석 처리할까요?`))return;
  }else{
    ROSTER=sortRoster([...ROSTER,{g,c,n,name,id,walkin:true}]);
    await DB.set('roster',ROSTER);
  }
  if(alsoCheck){
    if(!TODAY[id]){await DB.set(`att:${dateKey()}:${id}:${hhmm(new Date())}`,1);if(ABSENT[id])await DB.del(ABSENT[id].key);}
    toast(`${name} 추가 후 출석 처리했습니다.`);

    toast(`${name} 명단에 추가했습니다.`);
  }

  $('#walkin-box').classList.add('hidden');
  await loadToday(viewDate);renderToday();
}

  function resize(){const r=cv.getBoundingClientRect();const dpr=window.devicePixelRatio||1;const prev=dirty?cv.toDataURL():null;cv.width=r.width*dpr;cv.height=r.height*dpr;ctx.scale(dpr,dpr);ctx.lineWidth=2.2;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#20242E';if(prev){const im=new Image();im.onload=()=>ctx.drawImage(im,0,0,r.width,r.height);im.src=prev}}

  function end(){drawing=false}
  cv.addEventListener('mousedown',start);cv.addEventListener('mousemove',move);window.addEventListener('mouseup',end);

async function saveSup(dk){const inp=$(`.sup-in[data-date="${dk}"]`);if(!inp)return;const v=inp.value.trim();if(v)await DB.set('sup:'+dk,v);else await DB.del('sup:'+dk);if(dk===dateKey())SUP=v;toast(v?`${dk.slice(5)} 감독 저장`:`${dk.slice(5)} 감독 지움`)}
function parseSupDate(raw){raw=raw.trim();let m=raw.match(/^(\d{4})[-.\/](\d{1,2})[-.\/](\d{1,2})$/);if(m)return `${m[1]}-${pad(+m[2])}-${pad(+m[3])}`;m=raw.match(/^(\d{1,2})[-.\/](\d{1,2})$/);if(m){const y=(CFG.startDate||dateKey()).slice(0,4);return `${y}-${pad(+m[1])}-${pad(+m[2])}`}return null}
async function pasteSupervisors(){const raw=$('#sup-paste-text').value.trim();if(!raw)return toast('붙여넣을 내용이 없습니다.',true);let ok=0,skip=0;for(const line of raw.split(/\r?\n/)){const parts=line.split(/[\t,;]+|\s{2,}/).map(s=>s.trim()).filter(Boolean);if(parts.length<2){if(line.trim())skip++;continue}const dk=parseSupDate(parts[0]);const name=parts.slice(1).join(' ').trim();if(!dk||!name){skip++;continue}await DB.set('sup:'+dk,name);ok++;if(dk===dateKey())SUP=name}$('#sup-paste-text').value='';$('#sup-paste-box').classList.add('hidden');toast(`감독 ${ok}건 등록${skip?` (${skip}줄 건너뜀)`:''}`);renderSupervisor()}

  modal.style.cssText='position:fixed;inset:0;z-index:150;background:rgba(22,26,40,.5);display:flex;align-items:center;justify-content:center;padding:var(--s4);animation:fade .2s var(--ease)';

    <div style="display:flex;gap:var(--s2);margin-bottom:var(--s4)"><div class="stat-box" style="flex:1"><div class="k">참여</div><div class="n">${recs.length}<i>일</i></div></div><div class="stat-box" style="flex:1"><div class="k">기록된 공부시간</div><div class="n">${Math.floor(totalMin/60)}<i>시간 ${totalMin%60}분</i></div></div></div>

    <div style="margin-top:var(--s4);text-align:right"><button class="btn btn-sm" id="hist-csv">이 학생 이력 내려받기</button></div>

const DOW_MAP={'일':0,'월':1,'화':2,'수':3,'목':4,'금':5,'토':6};
function parseDays(raw){if(!raw)return null;const set=new Set();for(const ch of raw.replace(/요일/g,'')){if(DOW_MAP[ch]!=null)set.add(DOW_MAP[ch])}return set.size?[...set].sort():null}
async function addRoster(replace){

  const useDays=CFG.useSignupDays,out=replace?[]:[...ROSTER],seen=new Set(out.map(s=>s.id));let added=0,skipped=0;
  raw.split(/\r?\n/).forEach(line=>{const p=line.trim().split(/[\t,;]+|\s+/).filter(Boolean);if(p.length<4){if(line.trim())skipped++;return}const g=parseInt(p[0],10),c=parseInt(p[1],10),n=parseInt(p[2],10);if(!g||!c||!n){skipped++;return}let nameParts=p.slice(3),days=null;if(useDays){const lastTok=nameParts[nameParts.length-1];const parsed=parseDays(lastTok);if(parsed&&/^[월화수목금토일,·]+$/.test(lastTok.replace(/요일/g,''))){days=parsed;nameParts=nameParts.slice(0,-1)}}const name=nameParts.join(' ').trim();if(!name){skipped++;return}const id=`${g}-${c}-${n}`;if(seen.has(id)){skipped++;return}seen.add(id);out.push({g,c,n,name,id,...(days?{days}:{})});added++});
  ROSTER=sortRoster(out);await DB.set('roster',ROSTER);$('#ro-paste').value='';toast(`${added}명 등록했습니다.${skipped?` (${skipped}줄은 건너뜀)`:''}`);renderRoster();
}

  $('#cf-save').onclick=async()=>{const pin=$('#cf-pin').value.trim();if(pin&&!/^\d{4,6}$/.test(pin))return toast('PIN은 숫자 4~6자리로 넣어 주세요.',true);const days=$$('.cf-day:checked').map(c=>Number(c.value)).sort();const start=$('#cf-start').value||'18:00',end=$('#cf-end').value||'21:00';CFG={...CFG,school:$('#cf-school').value.trim()||'풍산고등학교',place:$('#cf-place').value.trim()||'4층 지혜의 숲',baseUrl:$('#cf-url').value.trim(),startTime:start,endTime:end,sessionMin:Math.max(0,mins(end)-mins(start)),lateAfter:Number($('#cf-late').value)||0,startDate:$('#cf-sd').value||CFG.startDate,endDate:$('#cf-ed').value||CFG.endDate,opDays:days.length?days:[1,2,3,4],useSignupDays:$('#cf-usedays').checked,autoOpen:$('#cf-autoopen').checked};if(pin)CFG.pin=hashPin(pin);const ok=await DB.set('config',CFG);EXCL=expandExclusions(CFG.exclusions);applyBrand();updateConnBadge();if(!DB.isRemote)toast('이 기기에만 저장됨 — 온라인 연결이 안 됩니다.',true);else if(pin)toast('저장했습니다. 새 PIN이 모든 기기에 적용됩니다.');else toast('저장했습니다.');renderSettings()};
  $('#cf-backup').onclick=backupAll;

function makeHakbun(s){return `${s.g}${pad(s.c)}${pad(s.n)}`}
let _exceljsLoading=null;
function loadExcelJS(){
  if(typeof ExcelJS!=='undefined')return Promise.resolve(true);
  if(_exceljsLoading)return _exceljsLoading;
  _exceljsLoading=new Promise(resolve=>{
    const srcs=['https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js','https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js'];
    let i=0;
    const tryNext=()=>{if(i>=srcs.length){resolve(false);return}const sc=document.createElement('script');sc.src=srcs[i++];sc.onload=()=>resolve(true);sc.onerror=tryNext;document.head.appendChild(sc)};
    tryNext();
  });
  return _exceljsLoading;
}
function attMark(rec,ab){if(rec)return isLate(rec.t)?'△':'O';if(ab)return '×';return ''}
async function exportMonthGrid(){
  toast('엑셀 모듈을 불러오는 중…');
  const loaded=await loadExcelJS();
  if(!loaded||typeof ExcelJS==='undefined'){toast('엑셀 모듈을 불러오지 못했습니다. 대신 CSV로 내려받습니다.',true);return exportMonthGridCSV()}
  toast('이번 달 출석부를 만드는 중…');
  const mk=monthKey();
  const dates=operatingDatesInMonth(Number(mk.slice(0,4)),Number(mk.slice(5,7)));
  if(!dates.length)return toast('이번 달 운영일이 없습니다.',true);
  // 날짜별 데이터 수집 (출석/사전불참/감독/서명)
  const attByDate={},abByDate={},supByDate={},signByDate={};
  for(const dk of dates){
    const [attKeys,abKeys,sup,sign]=await Promise.all([DB.list('att:'+dk),DB.list('ab:'+dk),DB.get('sup:'+dk),DB.get('sign:'+dk)]);
    const am={};for(const k of attKeys){const p=k.split(':');if(p.length<4)continue;am[p[2]]={t:p[3]}}
    const bm={};for(const k of abKeys){const p=k.split(':');if(p.length<3)continue;bm[p[2]]=true}
    attByDate[dk]=am;abByDate[dk]=bm;supByDate[dk]=sup||'';signByDate[dk]=sign||null;
  }
  // 주 단위(월요일 시작) 그룹화
  function weekStart(dk){const d=new Date(dk+'T00:00:00');const day=(d.getDay()+6)%7;d.setDate(d.getDate()-day);return dateKey(d)}
  const weeks={};dates.forEach(dk=>{(weeks[weekStart(dk)]||=[]).push(dk)});
  const weekKeys=Object.keys(weeks).sort();
  const roster=applyGrade(ROSTER);

  const wb=new ExcelJS.Workbook();
  const ws=wb.addWorksheet(`${Number(mk.slice(5,7))}월`,{views:[{showGridLines:false}]});
  const thin={style:'thin',color:{argb:'FF999999'}};
  const allBorder={top:thin,left:thin,bottom:thin,right:thin};
  const center={horizontal:'center',vertical:'middle'};
  let row=1;
  weekKeys.forEach((wk,wi)=>{
    const wdates=weeks[wk];
    const nCols=3+wdates.length+1;
    const lastCol=nCols;
    const targets=roster.filter(s=>wdates.some(dk=>isSignupDay(s,new Date(dk+'T00:00:00'))));
    // 제목
    ws.mergeCells(row,1,row,lastCol);
    const tc=ws.getCell(row,1);
    const wd0=new Date(wdates[0]+'T00:00:00'),wdN=new Date(wdates[wdates.length-1]+'T00:00:00');
    tc.value=`${mk.slice(0,4)}학년도 2학기 자기주도학습 출석부  ·  ${esc(CFG.place)}  ·  ${wd0.getMonth()+1}/${wd0.getDate()}~${wdN.getMonth()+1}/${wdN.getDate()} (${wi+1}주차)`;
    tc.font={bold:true,size:13};tc.alignment=center;ws.getRow(row).height=26;
    row++;
    const rDay=row, rDate=row+1;
    // 연번/학번/성명/비고 세로병합
    ws.mergeCells(rDay,1,rDate,1);ws.getCell(rDay,1).value='연번';
    ws.mergeCells(rDay,2,rDate,2);ws.getCell(rDay,2).value='학번';
    ws.mergeCells(rDay,3,rDate,3);ws.getCell(rDay,3).value='성명';
    ws.mergeCells(rDay,lastCol,rDate,lastCol);ws.getCell(rDay,lastCol).value='비고(참여요일)';
    [1,2,3,lastCol].forEach(c=>{const cell=ws.getCell(rDay,c);cell.alignment=center;cell.font={bold:true};cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFF3F2ED'}}});
    // 요일(대각선)/실시일
    wdates.forEach((dk,i)=>{
      const col=4+i,d=new Date(dk+'T00:00:00');
      const cd=ws.getCell(rDay,col);cd.value=DOW[d.getDay()];cd.alignment={horizontal:'right',vertical:'top'};cd.font={bold:true};
      cd.border={...allBorder,diagonal:{up:true,style:'thin',color:{argb:'FF999999'}}};
      const cdate=ws.getCell(rDate,col);cdate.value=`${d.getMonth()+1}/${d.getDate()}`;cdate.alignment=center;cdate.font={size:10};
    });
    ws.getRow(rDay).height=22;ws.getRow(rDate).height=18;
    row=rDate+1;
    // 학생 행
    targets.forEach((s,i)=>{
      const r=ws.getRow(row);
      r.getCell(1).value=i+1;r.getCell(1).alignment=center;
      r.getCell(2).value=makeHakbun(s);r.getCell(2).alignment=center;
      r.getCell(3).value=s.name;r.getCell(3).alignment={horizontal:'center',vertical:'middle'};
      wdates.forEach((dk,j)=>{const m=attMark(attByDate[dk][s.id],abByDate[dk][s.id]);const cell=r.getCell(4+j);cell.value=m;cell.alignment=center;if(m==='△')cell.font={color:{argb:'FFC4462A'}};if(m==='×')cell.font={color:{argb:'FF3E6B8C'}}});
      r.getCell(lastCol).value=daysLabel(s.days)||'전요일';r.getCell(lastCol).alignment=center;r.getCell(lastCol).font={size:10};
      r.height=18;row++;
    });
    // 재적/참가
    const rReg=row,rJoin=row+1;
    ws.mergeCells(rReg,1,rReg,3);ws.getCell(rReg,1).value='재적 인원';ws.getCell(rReg,1).alignment=center;
    wdates.forEach((dk,j)=>{const c=ws.getCell(rReg,4+j);c.value=targets.length;c.alignment=center});
    ws.mergeCells(rJoin,1,rJoin,3);ws.getCell(rJoin,1).value='참가 인원';ws.getCell(rJoin,1).alignment=center;
    wdates.forEach((dk,j)=>{const c=ws.getCell(rJoin,4+j);c.value=targets.filter(s=>attByDate[dk][s.id]).length;c.alignment=center});
    row=rJoin+1;
    // 감독 교사 / 서명
    const rSup=row,rSign=row+1;
    ws.mergeCells(rSup,1,rSup,3);ws.getCell(rSup,1).value='감독 교사';ws.getCell(rSup,1).alignment=center;
    wdates.forEach((dk,j)=>{const c=ws.getCell(rSup,4+j);c.value=supByDate[dk];c.alignment=center;c.font={size:10}});
    ws.mergeCells(rSign,1,rSign,3);ws.getCell(rSign,1).value='감독 서명';ws.getCell(rSign,1).alignment=center;
    ws.getRow(rSign).height=42;
    wdates.forEach((dk,j)=>{
      const sign=signByDate[dk];const col=4+j;const c=ws.getCell(rSign,col);c.alignment={horizontal:'center',vertical:'bottom'};c.font={size:9};
      if(sign&&sign.img){
        c.value=sign.by||'';
        try{const imgId=wb.addImage({base64:sign.img,extension:'png'});ws.addImage(imgId,{tl:{col:(col-1)+0.08,row:(rSign-1)+0.06},ext:{width:56,height:28}})}catch(e){c.value=`(서명) ${sign.by||''}`}
      }else c.value='';
    });
    row=rSign+1;
    // 테두리 (제목 아래부터 서명까지)
    for(let r=rDay;r<=rSign;r++)for(let cc=1;cc<=lastCol;cc++){const cell=ws.getCell(r,cc);const ex=cell.border||{};cell.border={...allBorder,...(ex.diagonal?{diagonal:ex.diagonal}:{})}}
    row+=1; // 주 사이 빈 줄
  });
  // 열 너비
  ws.getColumn(1).width=6;ws.getColumn(2).width=9;ws.getColumn(3).width=11;
  const maxDays=Math.max(...weekKeys.map(wk=>weeks[wk].length));
  for(let i=0;i<maxDays;i++)ws.getColumn(4+i).width=8;
  ws.getColumn(3+maxDays+1).width=13;
  const buf=await wb.xlsx.writeBuffer();
  const blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`풍산고_자기주도학습_출석부_${mk}.xlsx`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},400);
  toast('이번 달 출석부(엑셀)를 내려받았습니다.');
}
async function exportMonthGridCSV(){
  const mk=monthKey();
  const dates=operatingDatesInMonth(Number(mk.slice(0,4)),Number(mk.slice(5,7)));
  if(!dates.length)return toast('이번 달 운영일이 없습니다.',true);
  const attByDate={},abByDate={},supByDate={},signByDate={};
  for(const dk of dates){const [attKeys,abKeys,sup,sign]=await Promise.all([DB.list('att:'+dk),DB.list('ab:'+dk),DB.get('sup:'+dk),DB.get('sign:'+dk)]);const am={};for(const k of attKeys){const p=k.split(':');if(p.length<4)continue;am[p[2]]={t:p[3]}}const bm={};for(const k of abKeys){const p=k.split(':');if(p.length<3)continue;bm[p[2]]=true}attByDate[dk]=am;abByDate[dk]=bm;supByDate[dk]=sup||'';signByDate[dk]=sign&&sign.img?(sign.by||'서명'):''}
  function weekStart(dk){const d=new Date(dk+'T00:00:00');const day=(d.getDay()+6)%7;d.setDate(d.getDate()-day);return dateKey(d)}
  const weeks={};dates.forEach(dk=>{(weeks[weekStart(dk)]||=[]).push(dk)});
  const roster=applyGrade(ROSTER);const rows=[[`${mk.slice(0,4)}학년도 2학기 자기주도학습 출석부 (${Number(mk.slice(5,7))}월) · ${CFG.place}`]];rows.push([]);
  Object.keys(weeks).sort().forEach((wk,wi)=>{const wd=weeks[wk];const targets=roster.filter(s=>wd.some(dk=>isSignupDay(s,new Date(dk+'T00:00:00'))));const w0=new Date(wd[0]+'T00:00:00'),wN=new Date(wd[wd.length-1]+'T00:00:00');rows.push([`◆ ${wi+1}주차 (${w0.getMonth()+1}/${w0.getDate()}~${wN.getMonth()+1}/${wN.getDate()})`]);rows.push(['연번','학번','성명',...wd.map(dk=>DOW[new Date(dk+'T00:00:00').getDay()]),'비고']);rows.push(['','','실시일',...wd.map(dk=>dk.slice(5)),'']);let idx=0;targets.forEach(s=>{idx++;rows.push([idx,makeHakbun(s),s.name,...wd.map(dk=>attMark(attByDate[dk][s.id],abByDate[dk][s.id])),daysLabel(s.days)||'전요일'])});rows.push(['','','재적',...wd.map(()=>targets.length),'']);rows.push(['','','참가',...wd.map(dk=>targets.filter(s=>attByDate[dk][s.id]).length),'']);rows.push(['','','감독',...wd.map(dk=>supByDate[dk]),'']);rows.push(['','','서명',...wd.map(dk=>signByDate[dk]?`(서명) ${signByDate[dk]}`:''),'']);rows.push([])});
  downloadCSV(rows,`풍산고_자기주도학습_출석부_${mk}.csv`);toast('CSV로 내려받았습니다.');
}
async function resetAllAttendance(){
  if(!confirm('지금까지 쌓인 모든 출석·퇴실·사전불참 기록을 삭제합니다.\n(참여일·누적시간이 전부 0으로 초기화됩니다)\n명단·감독·서명·설정은 그대로 유지됩니다.\n계속할까요?'))return;
  const phrase=prompt('되돌릴 수 없습니다. 정말 초기화하려면 아래에 "초기화"라고 입력하세요.');
  if(phrase===null)return;
  if(phrase.trim()!=='초기화')return toast('초기화를 취소했습니다. (입력이 일치하지 않음)',true);
  toast('출석 기록을 삭제하는 중입니다…');
  const [attAll,outAll,abAll]=await Promise.all([DB.list('att:'),DB.list('out:'),DB.list('ab:')]);
  let n=0;
  for(const k of attAll){await DB.del(k);n++}
  for(const k of outAll){await DB.del(k)}
  for(const k of abAll){await DB.del(k)}
  TODAY={};ABSENT={};
  toast(`출석 기록을 모두 초기화했습니다. (${n}건 삭제)`);
  renderSettings();
}
async function backupAll(){
  toast('기록을 모으는 중입니다…');
  const [attAll,abAll]=await Promise.all([DB.list('att:'),DB.list('ab:')]);
  const supKeys=await DB.list('sup:');const supMap={};for(const k of supKeys){supMap[k.split(':')[1]]=await DB.get(k)}
  const rows=[['학교','장소','날짜','감독','구분','학년','반','번호','이름','출석시각','사유','인정시간(분)']];const smin=sessionMinutes();const recs=[];
  attAll.forEach(k=>{const p=k.split(':');if(p.length<4)return;recs.push({date:p[1],id:p[2],t:p[3],kind:'att'})});
  for(const k of abAll){const p=k.split(':');if(p.length<3)continue;const v=await DB.get(k);recs.push({date:p[1],id:p[2],kind:'ab',reason:(v&&v.reason)||''})}
  recs.sort((a,b)=>a.date.localeCompare(b.date)||a.id.localeCompare(b.id));
  recs.forEach(rec=>{const s=findStudent(rec.id)||{g:'',c:'',n:'',name:rec.id};if(rec.kind==='att')rows.push([CFG.school,CFG.place,rec.date,supMap[rec.date]||'',isLate(rec.t)?'지각':'출석',s.g,s.c,s.n,s.name,prettyTime(rec.t),'',smin]);else rows.push([CFG.school,CFG.place,rec.date,supMap[rec.date]||'','사전불참',s.g,s.c,s.n,s.name,'',rec.reason,0])});
  if(rows.length===1)return toast('백업할 기록이 없습니다.',true);
  downloadCSV(rows,`풍산고_자기주도학습_전체백업_${dateKey()}.csv`);toast(`${rows.length-1}건을 내려받았습니다.`);
}
function downloadCSV(rows,filename){const body=rows.map(r=>r.map(c=>{const v=String(c??'');return /[",\n]/.test(v)?`"${v.replace(/"/g,'""')}"`:v}).join(',')).join('\r\n');const blob=new Blob(['\uFEFF'+body],{type:'text/csv;charset=utf-8;'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},400)}

(async function init(){

})();
