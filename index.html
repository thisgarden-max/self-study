  --paper-0:#FBFAF7; --paper-1:#FFFFFF; --paper-2:#F3F2ED; --paper-3:#E9E7DF;
  --ink-900:#161A28; --ink-700:#333A52; --ink-500:#5C6480; --ink-400:#8A90A5; --ink-300:#AFB4C4;
  --lamp:#F0A32E; --lamp-deep:#B9740C; --lamp-ink:#8A5406; --lamp-tint:#FDF1DC; --lamp-tint-2:#FBE4BE;
  --alert:#C4462A; --alert-tint:#FBEAE5;
  --info:#3E6B8C; --info-tint:#E8F0F5;
  --line:#E4E2DA; --line-strong:#CFCCC2;
  --shadow-sm:0 1px 2px rgba(22,26,40,.05); --shadow-md:0 4px 14px rgba(22,26,40,.07); --shadow-lg:0 14px 44px rgba(22,26,40,.12);
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px; --s8:64px;
  --r-sm:6px; --r-md:12px; --r-lg:20px;
  --ease:cubic-bezier(.22,.61,.36,1);
  --f-display:'Bricolage Grotesque','Pretendard Variable',sans-serif;
  --f-body:'Pretendard Variable','Bricolage Grotesque',sans-serif;
  --f-data:'DM Mono','Pretendard Variable',monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:radial-gradient(1000px 560px at 82% -14%, rgba(240,163,46,.13), transparent 62%),radial-gradient(720px 480px at 2% 104%, rgba(51,58,82,.06), transparent 66%),var(--paper-0);background-attachment:fixed;color:var(--ink-900);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--lamp-deep);outline-offset:3px;border-radius:var(--r-sm)}
.hidden{display:none !important}
.wrap{max-width:1180px;margin:0 auto;padding:0 var(--s5)}
.eyebrow{font-family:var(--f-data);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-400)}
.brandline{font-family:var(--f-data);font-size:11px;letter-spacing:.2em;color:var(--lamp-deep);font-weight:500}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);padding:11px var(--s4);border-radius:var(--r-sm);border:1px solid var(--line-strong);background:var(--paper-1);font-size:14px;font-weight:600;color:var(--ink-900);box-shadow:var(--shadow-sm);transition:transform .16s var(--ease),background .16s var(--ease),border-color .16s var(--ease),box-shadow .16s var(--ease)}
.btn:hover{background:var(--paper-2);border-color:var(--ink-300);box-shadow:var(--shadow-md)}
.btn:active{transform:scale(.975)}
.btn-primary{background:var(--lamp);color:#2A1A02;border-color:var(--lamp-deep)}
.btn-primary:hover{background:#FFB44A;border-color:var(--lamp-deep)}
.btn-ghost{background:transparent;border-color:var(--line);box-shadow:none}
.btn-ghost:hover{background:var(--paper-2)}
.btn-sm{padding:6px 10px;font-size:12.5px}
.btn-danger{border-color:rgba(196,70,42,.35);color:var(--alert);background:var(--paper-1)}
.btn-danger:hover{background:var(--alert-tint);border-color:var(--alert)}
.btn[disabled]{opacity:.42;pointer-events:none;box-shadow:none}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12.5px;color:var(--ink-500);font-weight:600}
.input{width:100%;padding:10px var(--s3);border-radius:var(--r-sm);background:var(--paper-1);border:1px solid var(--line-strong);font-size:14.5px;transition:border-color .16s var(--ease),box-shadow .16s var(--ease)}
.input:focus{border-color:var(--lamp-deep);outline:none;box-shadow:0 0 0 3px var(--lamp-tint)}
select.input{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-400) 50%),linear-gradient(135deg,var(--ink-400) 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
textarea.input{resize:vertical;font-family:var(--f-data);font-size:13px;line-height:1.7}
.card{background:var(--paper-1);border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--s5);box-shadow:var(--shadow-sm)}
#v-student{min-height:100dvh;display:flex;flex-direction:column;padding:var(--s5) var(--s4) var(--s6)}
.s-shell{width:100%;max-width:440px;margin:0 auto;flex:1;display:flex;flex-direction:column}
.s-head{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--s4);margin-bottom:var(--s6)}
.s-head h1{font-family:var(--f-display);font-weight:800;font-size:19px;letter-spacing:-.02em;line-height:1.2}
.s-head h1 .brandline{display:block;margin-bottom:4px}
.s-head h1 .place{display:block;font-family:var(--f-body);font-size:11px;font-weight:600;color:var(--ink-400);letter-spacing:0;margin-top:3px}
.s-date{font-family:var(--f-data);font-size:12px;color:var(--ink-400);text-align:right;line-height:1.5;white-space:nowrap}
.s-date b{display:block;color:var(--ink-900);font-size:15px;font-weight:500}
.s-stage{flex:1;display:flex;flex-direction:column;justify-content:center;gap:var(--s5)}
.period-banner{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) var(--s4);border-radius:var(--r-md);background:var(--paper-1);border:1px solid var(--line);box-shadow:var(--shadow-sm)}
.period-banner.live{border-color:var(--lamp);background:var(--lamp-tint)}
.period-banner.off{border-color:var(--line-strong);background:var(--paper-2)}
.period-banner.excused{border-color:var(--info);background:var(--info-tint)}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--ink-300);flex:none}
.period-banner.live .pulse{background:var(--lamp-deep);animation:pulse 2s var(--ease) infinite}
.period-banner.excused .pulse{background:var(--info)}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.8)}}
.period-banner p{font-size:13.5px;color:var(--ink-500)}
.period-banner b{color:var(--ink-900);font-weight:600}

<body>

  <div class="s-shell">

    <nav class="t-bar">

        <div class="t-nav" id="t-nav">

<div id="projector" class="hidden">
  <div class="pj-live">출석 <b id="pj-count">0</b> / <span id="pj-total">0</span></div>
  <button class="btn btn-ghost pj-exit" id="pj-exit">닫기 (Esc)</button>
  <div class="logo pj-logo" style="margin:0 auto"></div><div class="pj-brand"><span id="pj-brand">풍산고등학교</span> · <span id="pj-place">4층 지혜의 숲</span></div>

<script>
const DB=(()=>{
  const remote=(typeof window!=='undefined'&&window.storage)?window.storage:null;
  const LP='sdl::';
  const lsOK=(()=>{try{localStorage.setItem('__t','1');localStorage.removeItem('__t');return true}catch(e){return false}})();
  const mem={};
  const enc=v=>JSON.stringify(v),dec=v=>{try{return JSON.parse(v)}catch(e){return v}};
  async function get(k,shared=true){
    if(remote){try{const r=await remote.get(k,shared);return r?dec(r.value):null}catch(e){return null}}
    const key=LP+(shared?'s:':'p:')+k;
    if(lsOK){const v=localStorage.getItem(key);return v===null?null:dec(v)}
    return mem[key]??null;
  }
  async function set(k,v,shared=true){
    if(remote){try{await remote.set(k,enc(v),shared);return true}catch(e){return false}}
    const key=LP+(shared?'s:':'p:')+k;
    if(lsOK){try{localStorage.setItem(key,enc(v));return true}catch(e){return false}}
    mem[key]=v;return true;
  }
  async function del(k,shared=true){
    if(remote){try{await remote.delete(k,shared);return true}catch(e){return false}}
    const key=LP+(shared?'s:':'p:')+k;
    if(lsOK){localStorage.removeItem(key);return true}
    delete mem[key];return true;
  }
  async function list(prefix='',shared=true){
    if(remote){try{const r=await remote.list(prefix,shared);return r&&r.keys?r.keys:[]}catch(e){return []}}
    const head=LP+(shared?'s:':'p:');
    const src=lsOK?Object.keys(localStorage):Object.keys(mem);
    return src.filter(k=>k.startsWith(head+prefix)).map(k=>k.slice(head.length));
  }
  return {get,set,del,list,isRemote:!!remote};
})();

const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
const pad=n=>String(n).padStart(2,'0');
const dateKey=(d=new Date())=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const monthKey=(d=new Date())=>`${d.getFullYear()}-${pad(d.getMonth()+1)}`;
const hhmm=(d=new Date())=>`${pad(d.getHours())}${pad(d.getMinutes())}`;
const prettyTime=t=>`${t.slice(0,2)}:${t.slice(2)}`;
const DOW=['일','월','화','수','목','금','토'];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mins=t=>{const[h,m]=t.split(':').map(Number);return h*60+m};
let toastTimer;
function toast(msg,warn=false){const el=$('#toast');el.textContent=msg;el.classList.toggle('warn',warn);el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2600)}
function makeCode(){const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';return Array.from({length:6},()=>A[Math.floor(Math.random()*A.length)]).join('')}
const hashPin=p=>{let h=5381;for(const c of String(p))h=((h<<5)+h+c.charCodeAt(0))>>>0;return 'h'+h.toString(36)};

function expandExclusions(list){const out={};(list||[]).forEach(e=>{if(!e.from)return;const to=e.to||e.from;let d=new Date(e.from+'T00:00:00'),end=new Date(to+'T00:00:00');while(d<=end){out[dateKey(d)]=e.reason||'제외일';d.setDate(d.getDate()+1)}});return out}
function dayStatus(d=new Date()){const dk=dateKey(d),dow=d.getDay(),days=CFG.opDays||[1,2,3,4];if(CFG.startDate&&dk<CFG.startDate)return{open:false,reason:'운영 시작 전'};if(CFG.endDate&&dk>CFG.endDate)return{open:false,reason:'운영 종료'};if(!days.includes(dow))return{open:false,reason:`${DOW[dow]}요일은 미운영`};if(EXCL[dk])return{open:false,reason:EXCL[dk]};return{open:true,reason:''}}
function operatingDates(){const out=[];if(!CFG.startDate||!CFG.endDate)return out;let d=new Date(CFG.startDate+'T00:00:00'),end=new Date(CFG.endDate+'T00:00:00');const today=dateKey();while(d<=end){const dk=dateKey(d);if(dk>today)break;if((CFG.opDays||[1,2,3,4]).includes(d.getDay())&&!EXCL[dk])out.push(dk);d.setDate(d.getDate()+1)}return out}
function isSignupDay(student,d=new Date()){if(!CFG.useSignupDays)return true;if(!student||!Array.isArray(student.days)||!student.days.length)return true;return student.days.includes(d.getDay())}

const DEFAULT_SUP={"2026-08-31":"한두희","2026-09-01":"장미란","2026-09-03":"김진희","2026-09-07":"김소영(영)","2026-09-08":"유혜형","2026-09-09":"원찬웅","2026-09-10":"박세라","2026-09-14":"이영화","2026-09-15":"윤현지","2026-09-16":"곽선영","2026-09-17":"김소영(수)","2026-09-21":"박정미","2026-09-22":"박종무","2026-09-28":"서주희","2026-09-29":"이재영","2026-09-30":"이유경","2026-10-01":"김수재","2026-10-06":"김하나","2026-10-07":"이정원","2026-10-19":"김효정","2026-10-21":"정대혁","2026-10-22":"김정영","2026-10-26":"이유경","2026-10-28":"석류","2026-10-29":"김동명","2026-11-02":"이미영","2026-11-03":"신수민","2026-11-04":"박혜지","2026-11-05":"장미란","2026-11-09":"김소영(영)","2026-11-10":"유혜형","2026-11-11":"원찬웅","2026-11-12":"김진희","2026-11-16":"한두희","2026-11-17":"이영화","2026-11-23":"서주희","2026-11-24":"이정원","2026-11-25":"진병권","2026-11-26":"이재영","2026-11-30":"석류","2026-12-01":"오민숙","2026-12-02":"조은","2026-12-03":"정지영"};

const DEFAULTS={
  school:'풍산고등학교', place:'4층 지혜의 숲', pin:hashPin('1234'), baseUrl:'',
  startTime:'18:00', endTime:'21:00', sessionMin:180, lateAfter:15, ttlMin:5,
  startDate:'2026-08-31', endDate:'2026-12-03', opDays:[1,2,3,4], useSignupDays:false,
  supSeeded:false,
  exclusions:[
    {from:'2026-09-02',reason:'전국연합평가'},
    {from:'2026-10-05',reason:'대체공휴일'},
    {from:'2026-10-12',to:'2026-10-16',reason:'1차 정기시험'},
    {from:'2026-10-20',reason:'전국연합평가'},
    {from:'2026-10-27',reason:'신입생 학교설명회'},
    {from:'2026-11-18',reason:'제외일'}
  ]
};
const ABSENCE_REASONS=['학원','병원','가정 사정','개인 사정','기타'];
let CFG={...DEFAULTS},EXCL={},ROSTER=[],LIVE=null,TODAY={},ABSENT={},SUP='',ME=null;

async function loadCore(){
  const [cfg,ros]=await Promise.all([DB.get('config'),DB.get('roster')]);
  if(cfg)CFG={...DEFAULTS,...cfg};
  EXCL=expandExclusions(CFG.exclusions);
  ROSTER=Array.isArray(ros)?ros:[];
  if(!CFG.supSeeded){
    for(const dk in DEFAULT_SUP){const ex=await DB.get('sup:'+dk);if(ex==null)await DB.set('sup:'+dk,DEFAULT_SUP[dk])}
    CFG.supSeeded=true; await DB.set('config',CFG);
  }
  applyBrand();
}
function applyBrand(){const n=CFG.school||'풍산고등학교',pl=CFG.place||'';[['#st-school',n],['#lock-school',n],['#t-school',n],['#pj-brand',n],['#st-place',pl],['#pj-place',pl]].forEach(([sel,val])=>{const el=$(sel);if(el)el.textContent=val});document.title=`${n} 자기주도학습 출석`}
async function loadLive(){LIVE=await DB.get('live');if(LIVE&&Date.now()-LIVE.issuedAt>(LIVE.ttl||5)*60000+60000)LIVE.expired=true;return LIVE}
async function loadToday(){
  const dk=dateKey();
  const [attKeys,abKeys,sup]=await Promise.all([DB.list('att:'+dk),DB.list('ab:'+dk),DB.get('sup:'+dk)]);
  TODAY={};ABSENT={};
  for(const k of attKeys){const p=k.split(':');if(p.length<4)continue;TODAY[p[2]]={t:p[3],key:k}}
  for(const k of abKeys){const p=k.split(':');if(p.length<3)continue;const v=await DB.get(k);ABSENT[p[2]]={reason:(v&&v.reason)||'사전 불참',at:(v&&v.at)||'',key:k}}
  SUP=sup||'';
  return TODAY;
}
const findStudent=id=>ROSTER.find(s=>s.id===id)||null;
const sortRoster=a=>a.sort((x,y)=>x.g-y.g||x.c-y.c||x.n-y.n||x.name.localeCompare(y.name,'ko'));
function isLate(t){const cur=Number(t.slice(0,2))*60+Number(t.slice(2));return cur>mins(CFG.startTime)+(CFG.lateAfter||0)}
function fmtHours(m){const h=Math.floor(m/60),r=m%60;return r?`${h}.${Math.round(r/6)}`:`${h}`}
const sessionMinutes=()=>CFG.sessionMin||Math.max(0,mins(CFG.endTime)-mins(CFG.startTime));
const daysLabel=arr=>Array.isArray(arr)&&arr.length?arr.slice().sort().map(d=>DOW[d]).join('·'):'';

function showStudent(){$('#v-student').classList.remove('hidden');$('#v-teacher').classList.add('hidden');stopTeacherPoll();renderStudent()}
function showTeacher(){$('#v-student').classList.add('hidden');$('#v-teacher').classList.remove('hidden');$('#lock').classList.remove('hidden');$('#t-app').classList.add('hidden');setTimeout(()=>$('#pin-in').focus(),80)}

function tickClock(){const d=new Date();$('#st-date').textContent=`${d.getMonth()+1}월 ${d.getDate()}일 ${DOW[d.getDay()]}요일`;$('#st-clock').textContent=`${pad(d.getHours())}:${pad(d.getMinutes())}`}
let urlCode=null;
function readUrlCode(){const h=location.hash||'';const m=h.match(/[#&]t=([A-Z0-9]{4,10})/i);if(m)urlCode=m[1].toUpperCase();const q=new URLSearchParams(location.search);if(q.get('t'))urlCode=q.get('t').toUpperCase()}
let absentMode=false;

async function renderStudent(){
  tickClock();
  const stage=$('#st-stage');
  await loadLive();await loadToday();
  if(!ROSTER.length){stage.innerHTML=`<div class="card"><div class="empty" style="padding:var(--s6) 0"><b>아직 명렬표가 없습니다</b>선생님이 명단을 등록하기 전이라면 잠시 기다려 주세요.</div></div><div class="absent-link" style="margin-top:var(--s4)"><button id="st-self0">명단에 내 이름이 없어요 · 직접 입력</button></div>`;$('#st-change').classList.add('hidden');const b=$('#st-self0');if(b)b.onclick=renderSelfEnroll;return}
  if(!ME||!findStudent(ME)){renderPicker();return}
  $('#st-change').classList.remove('hidden');
  const me=findStudent(ME),rec=TODAY[ME],ab=ABSENT[ME],st=dayStatus(),signup=isSignupDay(me);
  const sessionOpen=LIVE&&!LIVE.expired,codeOK=sessionOpen&&urlCode&&urlCode===LIVE.code;
  if(absentMode&&st.open&&!rec){
    stage.innerHTML=`
      <div class="me-card"><div class="me-tag">${me.g}학년 ${me.c}반 ${me.n}번</div><div class="me-name">${esc(me.name)}</div><div class="me-sub">오늘 참여할 수 없나요?</div></div>
      <div class="notice">사유를 고르면 <b>사전 불참</b>으로 기록됩니다. 무단결석과 구분되어 선생님께 전달돼요.</div>
      <div class="reason-grid">${ABSENCE_REASONS.map(r=>`<button class="reason-btn" data-reason="${esc(r)}">${esc(r)}</button>`).join('')}</div>
      <button class="btn btn-ghost" id="ab-cancel" style="width:100%">뒤로</button>`;
    $$('[data-reason]').forEach(b=>b.onclick=()=>reportAbsent(b.dataset.reason));
    $('#ab-cancel').onclick=()=>{absentMode=false;renderStudent()};
    return;
  }
  let banner;
  if(!st.open)banner=`<div class="period-banner off"><i class="pulse"></i><p>오늘은 자기주도학습 <b>운영일이 아닙니다</b>${st.reason?` · ${esc(st.reason)}`:''}.</p></div>`;
  else if(!signup)banner=`<div class="period-banner off"><i class="pulse"></i><p>오늘(${DOW[new Date().getDay()]})은 <b>신청한 요일이 아닙니다</b>. 참여를 원하면 출석해도 됩니다.</p></div>`;
  else if(ab&&!rec)banner=`<div class="period-banner excused"><i class="pulse"></i><p><b>사전 불참</b>으로 신고되어 있습니다 · ${esc(ab.reason)}</p></div>`;
  else if(!sessionOpen)banner=`<div class="period-banner"><i class="pulse"></i><p>지금은 출석을 받고 있지 않습니다. <b>선생님이 QR을 띄우면</b> 열립니다.</p></div>`;
  else banner=`<div class="period-banner live"><i class="pulse"></i><p><b>자기주도학습</b> 출석을 받는 중입니다 (${CFG.startTime}~${CFG.endTime}).</p></div>`;
  let action='';
  if(!st.open)action=`<div class="notice">${esc(CFG.place||'')}<br>다음 운영일에 다시 만나요.</div>`;
  else if(rec){const late=isLate(rec.t);action=`<div class="stamp"><div class="stamp-mark">출석</div><h2>${esc(me.name)} 학생, 확인했습니다</h2><p>${prettyTime(rec.t)} 체크${late?' · 지각':''}</p></div>`}
  else if(ab)action=`<div class="stamp excused"><div class="stamp-mark">불참</div><h2>사전 불참 신고 완료</h2><p>${esc(ab.reason)}${ab.at?` · ${prettyTime(ab.at)} 신고`:''}</p></div><button class="btn btn-ghost" id="ab-undo" style="width:100%">신고 취소하고 출석하기</button>`;
  else if(codeOK)action=`<button class="tap" id="st-check">출석하기<small>누르면 바로 기록됩니다</small></button><div class="absent-link"><button id="ab-open">오늘 참여할 수 없어요 (사전 불참 신고)</button></div>`;
  else if(sessionOpen)action=`<div class="picker"><div class="field"><label for="st-code">화면의 6자리 코드</label><input class="input" id="st-code" maxlength="6" autocapitalize="characters" autocomplete="off" style="font-family:var(--f-data);font-size:22px;letter-spacing:.24em;text-align:center" placeholder="ABC123"></div><button class="btn btn-primary" id="st-code-go" style="width:100%;padding:13px">코드 확인</button><p class="hint" style="text-align:center">QR을 스캔하면 코드는 자동으로 입력됩니다.</p></div><div class="absent-link"><button id="ab-open">오늘 참여할 수 없어요 (사전 불참 신고)</button></div>`;
  else action=`<div class="notice">${esc(CFG.place||'')} 화면의 QR을 스캔하면 출석 버튼이 나타납니다.</div><div class="absent-link"><button id="ab-open">오늘 미리 불참 신고하기</button></div>`;
  const dl=daysLabel(me.days);
  stage.innerHTML=`${banner}<div class="me-card"><div class="me-tag">${me.g}학년 ${me.c}반 ${me.n}번</div><div class="me-name">${esc(me.name)}</div><div class="me-sub">${st.open?'오늘의 출석 상태':'오늘의 안내'}</div>${CFG.useSignupDays&&dl?`<div class="me-days">신청 요일 <b>${dl}</b></div>`:''}</div>${action}<div id="st-mystats"></div>`;
  if($('#st-check'))$('#st-check').onclick=doCheckIn;

async function addRoster(replace){
  const raw=$('#ro-paste').value.trim();if(!raw)return toast('붙여넣을 명단이 없습니다.',true);
  const useDays=CFG.useSignupDays,out=replace?[]:[...ROSTER],seen=new Set(out.map(s=>s.id));let added=0,skipped=0;
  raw.split(/\r?\n/).forEach(line=>{const p=line.trim().split(/[\t,;]+|\s+/).filter(Boolean);if(p.length<4){if(line.trim())skipped++;return}const g=parseInt(p[0],10),c=parseInt(p[1],10),n=parseInt(p[2],10);if(!g||!c||!n){skipped++;return}let nameParts=p.slice(3),days=null;if(useDays){const lastTok=nameParts[nameParts.length-1];const parsed=parseDays(lastTok);if(parsed&&/^[월화수목금토일,·]+$/.test(lastTok.replace(/요일/g,''))){days=parsed;nameParts=nameParts.slice(0,-1)}}const name=nameParts.join(' ').trim();if(!name){skipped++;return}const id=`${g}-${c}-${n}`;if(seen.has(id)){skipped++;return}seen.add(id);out.push({g,c,n,name,id,...(days?{days}:{})});added++});
  ROSTER=sortRoster(out);await DB.set('roster',ROSTER);$('#ro-paste').value='';toast(`${added}명 등록했습니다.${skipped?` (${skipped}줄은 건너뜀)`:''}`);renderRoster();
}

function renderSettings(){
  const el=$('#tab-settings'),dayChips=[['월',1],['화',2],['수',3],['목',4],['금',5]];
  el.innerHTML=`<div class="p-title"><div><div class="brandline">${esc(CFG.school)} · ${esc(CFG.place)}</div><div class="eyebrow" style="margin-bottom:5px">운영 방식</div><h2>설정</h2></div></div>
    <div class="card" style="margin-bottom:var(--s5)"><h3 style="font-family:var(--f-display);font-size:16px;font-weight:600;margin-bottom:var(--s4)">기본</h3><div class="form-grid"><div class="field"><label for="cf-school">학교 이름</label><input class="input" id="cf-school" value="${esc(CFG.school)}"></div><div class="field"><label for="cf-place">장소</label><input class="input" id="cf-place" value="${esc(CFG.place)}"></div><div class="field" style="grid-column:1/-1"><label for="cf-url">배포 주소 (QR에 담길 주소)</label><input class="input" id="cf-url" placeholder="https://pungsan-sdl.netlify.app/" value="${esc(CFG.baseUrl)}"><p class="hint">이 파일을 올린 웹 주소를 넣어 주세요. 비워두면 지금 열려 있는 주소가 쓰이는데, 학생 휴대폰에서는 열리지 않을 수 있습니다.</p></div></div></div>
    <div class="card" style="margin-bottom:var(--s5)"><h3 style="font-family:var(--f-display);font-size:16px;font-weight:600;margin-bottom:var(--s4)">시간</h3><div class="form-grid"><div class="field"><label for="cf-start">시작 시각</label><input class="input" id="cf-start" type="time" value="${CFG.startTime}"></div><div class="field"><label for="cf-end">종료 시각</label><input class="input" id="cf-end" type="time" value="${CFG.endTime}"></div><div class="field"><label for="cf-late">지각 기준 (시작 후 몇 분)</label><input class="input" id="cf-late" type="number" min="0" max="120" value="${CFG.lateAfter}"></div><div class="field"><label for="cf-ttl">QR 코드 갱신 주기 (분)</label><input class="input" id="cf-ttl" type="number" min="1" max="60" value="${CFG.ttlMin}"><p class="hint">짧을수록 대리출석을 막기 좋습니다.</p></div></div></div>
    <div class="card" style="margin-bottom:var(--s5)"><h3 style="font-family:var(--f-display);font-size:16px;font-weight:600;margin-bottom:var(--s4)">운영 기간 · 요일</h3><div class="form-grid"><div class="field"><label for="cf-sd">운영 시작일</label><input class="input" id="cf-sd" type="date" value="${CFG.startDate}"></div><div class="field"><label for="cf-ed">운영 종료일</label><input class="input" id="cf-ed" type="date" value="${CFG.endDate}"></div></div><div class="field" style="margin-top:var(--s4)"><label>운영 요일</label><div style="display:flex;gap:var(--s2);flex-wrap:wrap;margin-top:2px">${dayChips.map(([l,v])=>`<label style="display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:var(--r-sm);border:1px solid var(--line-strong);background:var(--paper-1);font-size:13.5px;font-weight:600;cursor:pointer"><input type="checkbox" class="cf-day" value="${v}" ${(CFG.opDays||[]).includes(v)?'checked':''}> ${l}</label>`).join('')}</div></div></div>
    <div class="card" style="margin-bottom:var(--s5)"><h3 style="font-family:var(--f-display);font-size:16px;font-weight:600;margin-bottom:var(--s2)">신청 요일 관리</h3><div class="toggle-row"><div><div style="font-weight:600;font-size:14px">학생별 신청 요일로 관리</div><p class="hint" style="margin-top:2px">켜면 명렬표에 요일 칸이 생기고, 참여율을 <b>신청한 날 기준</b>으로 계산합니다. 신청서 받은 뒤 켜세요.</p></div><label class="switch"><input type="checkbox" id="cf-usedays" ${CFG.useSignupDays?'checked':''}><span class="track"></span></label></div></div>
    <div class="card" style="margin-bottom:var(--s5)"><h3 style="font-family:var(--f-display);font-size:16px;font-weight:600;margin-bottom:var(--s3)">제외일</h3><p class="hint" style="margin-bottom:var(--s3)">이 날짜에는 자동으로 미운영으로 표시되고, 통계 분모(운영일)에서도 빠집니다.</p><div class="excl-list">${(CFG.exclusions||[]).map((e,i)=>`<div class="excl-item"><span class="d">${e.from}${e.to&&e.to!==e.from?` ~ ${e.to}`:''}</span><span class="r">${esc(e.reason||'제외일')}</span><button class="btn btn-ghost btn-sm" data-ex-del="${i}">삭제</button></div>`).join('')||'<p class="hint">등록된 제외일이 없습니다.</p>'}</div><div class="form-grid" style="margin-top:var(--s4)"><div class="field"><label for="ex-from">시작일</label><input class="input" id="ex-from" type="date"></div><div class="field"><label for="ex-to">종료일 (하루면 비워두기)</label><input class="input" id="ex-to" type="date"></div><div class="field"><label for="ex-reason">사유</label><input class="input" id="ex-reason" placeholder="예: 전국연합평가"></div></div><button class="btn btn-ghost" id="ex-add" style="margin-top:var(--s3)">제외일 추가</button></div>
    <div class="card" style="margin-bottom:var(--s5)"><h3 style="font-family:var(--f-display);font-size:16px;font-weight:600;margin-bottom:var(--s4)">교사용 PIN</h3><div class="form-grid"><div class="field"><label for="cf-pin">새 PIN (4~6자리)</label><input class="input" id="cf-pin" type="password" inputmode="numeric" maxlength="6" placeholder="바꾸지 않으려면 비워두세요" autocomplete="new-password"></div></div></div>
    <div style="display:flex;gap:var(--s2);flex-wrap:wrap"><button class="btn btn-primary" id="cf-save">저장</button><button class="btn btn-ghost" id="cf-backup">전체 기록 백업 (CSV)</button></div>
    <p class="hint" style="margin-top:var(--s5);max-width:640px">기록은 이 앱의 저장소에 쌓입니다. 학기가 끝날 때, 혹은 한 달에 한 번은 <b>전체 기록 백업</b>을 눌러 엑셀 파일로 따로 보관해 두시길 권합니다.</p>`;
  $('#ex-add').onclick=async()=>{const from=$('#ex-from').value;if(!from)return toast('시작일을 골라 주세요.',true);const to=$('#ex-to').value||'',reason=$('#ex-reason').value.trim()||'제외일';CFG.exclusions=[...(CFG.exclusions||[]),{from,...(to&&to!==from?{to}:{}),reason}].sort((a,b)=>a.from.localeCompare(b.from));EXCL=expandExclusions(CFG.exclusions);await DB.set('config',CFG);toast('제외일을 추가했습니다.');renderSettings()};
  $$('[data-ex-del]').forEach(b=>b.onclick=async()=>{CFG.exclusions=(CFG.exclusions||[]).filter((_,i)=>i!==Number(b.dataset.exDel));EXCL=expandExclusions(CFG.exclusions);await DB.set('config',CFG);toast('제외일을 삭제했습니다.');renderSettings()});
  $('#cf-save').onclick=async()=>{const pin=$('#cf-pin').value.trim();if(pin&&!/^\d{4,6}$/.test(pin))return toast('PIN은 숫자 4~6자리로 넣어 주세요.',true);const days=$$('.cf-day:checked').map(c=>Number(c.value)).sort();const start=$('#cf-start').value||'18:00',end=$('#cf-end').value||'21:00';CFG={...CFG,school:$('#cf-school').value.trim()||'풍산고등학교',place:$('#cf-place').value.trim()||'4층 지혜의 숲',baseUrl:$('#cf-url').value.trim(),startTime:start,endTime:end,sessionMin:Math.max(0,mins(end)-mins(start)),lateAfter:Number($('#cf-late').value)||0,ttlMin:Math.max(1,Number($('#cf-ttl').value)||5),startDate:$('#cf-sd').value||CFG.startDate,endDate:$('#cf-ed').value||CFG.endDate,opDays:days.length?days:[1,2,3,4],useSignupDays:$('#cf-usedays').checked};if(pin)CFG.pin=hashPin(pin);await DB.set('config',CFG);EXCL=expandExclusions(CFG.exclusions);applyBrand();toast('저장했습니다.');renderSettings()};
  $('#cf-backup').onclick=backupAll;
}
async function backupAll(){
  toast('기록을 모으는 중입니다…');
  const [attAll,abAll]=await Promise.all([DB.list('att:'),DB.list('ab:')]);
  const supKeys=await DB.list('sup:');const supMap={};for(const k of supKeys){supMap[k.split(':')[1]]=await DB.get(k)}
  const rows=[['학교','장소','날짜','감독','구분','학년','반','번호','이름','출석시각','사유','인정시간(분)']];const smin=sessionMinutes();const recs=[];
  attAll.forEach(k=>{const p=k.split(':');if(p.length<4)return;recs.push({date:p[1],id:p[2],t:p[3],kind:'att'})});
  for(const k of abAll){const p=k.split(':');if(p.length<3)continue;const v=await DB.get(k);recs.push({date:p[1],id:p[2],kind:'ab',reason:(v&&v.reason)||''})}
  recs.sort((a,b)=>a.date.localeCompare(b.date)||a.id.localeCompare(b.id));
  recs.forEach(rec=>{const s=findStudent(rec.id)||{g:'',c:'',n:'',name:rec.id};if(rec.kind==='att')rows.push([CFG.school,CFG.place,rec.date,supMap[rec.date]||'',isLate(rec.t)?'지각':'출석',s.g,s.c,s.n,s.name,prettyTime(rec.t),'',smin]);else rows.push([CFG.school,CFG.place,rec.date,supMap[rec.date]||'','사전불참',s.g,s.c,s.n,s.name,'',rec.reason,0])});
  if(rows.length===1)return toast('백업할 기록이 없습니다.',true);
  downloadCSV(rows,`풍산고_자기주도학습_전체백업_${dateKey()}.csv`);toast(`${rows.length-1}건을 내려받았습니다.`);
}
function downloadCSV(rows,filename){const body=rows.map(r=>r.map(c=>{const v=String(c??'');return /[",\n]/.test(v)?`"${v.replace(/"/g,'""')}"`:v}).join(',')).join('\r\n');const blob=new Blob(['\uFEFF'+body],{type:'text/csv;charset=utf-8;'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},400)}

(async function init(){readUrlCode();await loadCore();ME=await DB.get('me',false);tickClock();setInterval(tickClock,20000);showStudent();setInterval(()=>{if(!$('#v-student').classList.contains('hidden'))renderStudent()},45000)})();
</script>
